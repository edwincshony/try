<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Instant Math Bubble Ranker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: system-ui, sans-serif; }
        #video-container { position: relative; width: 100vw; height: 100vh; }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            text-align: center;
            width: 90%;
        }
        .status-pill {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            color: white;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: inline-block;
        }
        .error-toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            display: none;
            z-index: 100;
        }
    </style>
</head>
<body>

<div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    
    <div class="ui-overlay">
        <div id="status" class="status-pill">Initializing Camera...</div>
    </div>

    <div id="error-toast" class="error-toast"></div>
</div>

<script>
    const apiKey = ""; // Environment handles this
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');
    const errorToast = document.getElementById('error-toast');

    let isProcessing = false;

    // --- Core Logic ---

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", focusMode: "continuous" }
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    resolve();
                };
            });
        } catch (err) {
            showError("Camera access denied. Please allow camera permissions.");
        }
    }

    function showError(msg) {
        errorToast.textContent = msg;
        errorToast.style.display = 'block';
        setTimeout(() => { errorToast.style.display = 'none'; }, 5000);
    }

    async function processFrame() {
        if (isProcessing) return;
        isProcessing = true;
        statusEl.textContent = "Scanning expressions...";

        // Capture current frame
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = video.videoWidth;
        tempCanvas.height = video.videoHeight;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.drawImage(video, 0, 0);
        const base64Image = tempCanvas.toDataURL('image/jpeg', 0.8).split(',')[1];

        try {
            const result = await callGeminiAPI(base64Image);
            if (result && result.bubbles) {
                drawOverlays(result.bubbles);
                statusEl.textContent = "Ready";
            } else {
                statusEl.textContent = "No bubbles found";
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }
        } catch (err) {
            console.error(err);
        } finally {
            isProcessing = false;
            // Delay for the next scan to save battery/API quota, but keep it fast
            setTimeout(processFrame, 400); 
        }
    }

    async function callGeminiAPI(base64Data) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
        
        const prompt = `Identify exactly 3 math bubbles in this image. Return a JSON object with a 'bubbles' array. Each bubble needs 'x' and 'y' (normalized 0-1000 coordinates for center), 'expression', and its 'result'. The app will order them 1-3 based on smallest result to largest.
        Example format: {"bubbles": [{"x": 200, "y": 300, "expression": "5+5", "result": 10}, ...]}`;

        const payload = {
            contents: [{
                parts: [
                    { text: prompt },
                    { inlineData: { mimeType: "image/jpeg", data: base64Data } }
                ]
            }],
            generationConfig: {
                responseMimeType: "application/json"
            }
        };

        let retries = 5;
        let delay = 1000;

        while (retries > 0) {
            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (!response.ok) throw new Error('API Error');
                
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } catch (err) {
                retries--;
                if (retries === 0) throw err;
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
        }
    }

    function drawOverlays(bubbles) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Sort bubbles by result (Smallest -> Largest)
        const sorted = [...bubbles].sort((a, b) => a.result - b.result);

        sorted.forEach((bubble, index) => {
            const rank = index + 1;
            const x = (bubble.x / 1000) * canvas.width;
            const y = (bubble.y / 1000) * canvas.height;

            // Draw Rank Circle
            ctx.beginPath();
            ctx.arc(x, y, 40, 0, Math.PI * 2);
            ctx.fillStyle = getRankColor(rank);
            ctx.fill();
            ctx.strokeStyle = 'white';
            ctx.lineWidth = 4;
            ctx.stroke();

            // Draw Number
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(rank, x, y);

            // Draw Result small above
            ctx.font = 'bold 20px sans-serif';
            ctx.fillText(`(${bubble.result})`, x, y + 60);
        });
    }

    function getRankColor(rank) {
        if (rank === 1) return '#22c55e'; // Green (Smallest)
        if (rank === 2) return '#eab308'; // Yellow (Medium)
        return '#ef4444'; // Red (Largest)
    }

    // Initialize
    window.onload = async () => {
        await setupCamera();
        processFrame();
    };

    // Handle screen resizing
    window.addEventListener('resize', () => {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
    });

</script>
</body>
</html>
