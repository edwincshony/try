<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Bubble Ranker</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        video {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas#overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        canvas#hidden-buffer {
            display: none;
        }

        .error-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            z-index: 100;
            display: none;
        }
    </style>
</head>
<body>

<div id="app-container">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="overlay"></canvas>
    <canvas id="hidden-buffer"></canvas>
    <div id="error-msg" class="error-overlay"></div>
</div>

<script>
    const video = document.getElementById('webcam');
    const overlay = document.getElementById('overlay');
    const ctx = overlay.getContext('2d');
    const buffer = document.getElementById('hidden-buffer');
    const bctx = buffer.getContext('2d');
    const errorMsg = document.getElementById('error-msg');

    const apiKey = ""; 
    const modelUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

    let isProcessing = false;

    async function setupCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            });
            video.srcObject = stream;
            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resolve(video);
                };
            });
        } catch (e) {
            showError("Camera access denied or unavailable.");
        }
    }

    function showError(text) {
        errorMsg.textContent = text;
        errorMsg.style.display = 'block';
        setTimeout(() => { errorMsg.style.display = 'none'; }, 3000);
    }

    function resizeCanvas() {
        overlay.width = window.innerWidth;
        overlay.height = window.innerHeight;
    }

    async function processFrame() {
        if (isProcessing) return;
        isProcessing = true;

        // Prepare buffer canvas for snapshot
        buffer.width = video.videoWidth;
        buffer.height = video.videoHeight;
        bctx.drawImage(video, 0, 0, buffer.width, buffer.height);
        
        const base64Image = buffer.toDataURL('image/jpeg', 0.6).split(',')[1];

        const payload = {
            contents: [{
                parts: [
                    { text: "Detect exactly 3 math bubbles in this image. For each, find its center coordinates [x, y] as percentages of image width/height (0-100) and solve the math expression. Return ONLY a JSON array of 3 objects: [{\"x\": number, \"y\": number, \"val\": number}]. Do not explain." },
                    { inlineData: { mimeType: "image/jpeg", data: base64Image } }
                ]
            }],
            generationConfig: {
                responseMimeType: "application/json"
            }
        };

        try {
            const response = await fetchWithRetry(modelUrl, payload);
            const data = await response.json();
            const results = JSON.parse(data.candidates[0].content.parts[0].text);
            
            if (Array.isArray(results) && results.length === 3) {
                renderRankings(results);
            }
        } catch (err) {
            // Silently fail to maintain UI cleanliness
        }

        isProcessing = false;
    }

    async function fetchWithRetry(url, payload, retries = 5) {
        let delay = 1000;
        for (let i = 0; i < retries; i++) {
            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (res.ok) return res;
            } catch (e) {}
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
        }
        throw new Error("API Max Retries");
    }

    function renderRankings(bubbles) {
        // Sort by value (smallest to largest)
        const sorted = [...bubbles].sort((a, b) => a.val - b.val);
        
        // Assign rank: index + 1
        const ranked = bubbles.map(b => {
            const rank = sorted.findIndex(s => s.val === b.val) + 1;
            return { ...b, rank };
        });

        ctx.clearRect(0, 0, overlay.width, overlay.height);

        ranked.forEach(b => {
            const screenX = (b.x / 100) * overlay.width;
            const screenY = (b.y / 100) * overlay.height;

            // Draw Rank Circle
            ctx.beginPath();
            ctx.arc(screenX, screenY, 40, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.fill();
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Draw Number
            ctx.fillStyle = '#000';
            ctx.font = 'bold 48px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(b.rank, screenX, screenY);
        });
    }

    window.addEventListener('resize', resizeCanvas);

    window.onload = async () => {
        resizeCanvas();
        await setupCamera();
        
        // Start high-frequency loop
        setInterval(processFrame, 500); 
    };
</script>

</body>
</html>
